services:
  - type: web
    name: litellm
    runtime: image
    image:
      url: docker.litellm.ai/berriai/litellm-database:main-stable
    plan: starter
    region: oregon
    healthCheckPath: /health/liveliness
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: litellm-db
          property: connectionString
      - key: LITELLM_MASTER_KEY
        generateValue: true
      - key: LITELLM_SALT_KEY
        generateValue: true
      - key: STORE_MODEL_IN_DB
        value: "True"
      - key: PORT
        value: "4000"

databases:
  - name: litellm-db
    plan: basic-256mb
    region: oregon
